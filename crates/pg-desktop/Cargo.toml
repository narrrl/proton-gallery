[package]
name = "pg-desktop"
description = "Proton Gallery for Linux and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "proton-gallery"
path = "src/main.rs"

[dependencies]
proton-gallery-app-rs.workspace = true
proton-gallery-rs.workspace = true
proton-gallery-drive-rs.workspace = true
proton-sdk.workspace = true
tempfile.workspace = true
serde_json.workspace = true
iced = { version = "=0.14.0", features = ["image", "svg", "tokio", "advanced", "canvas"] }
# The keyring store shared with proton-drive-linux and Proton Stream. Reads the
# items `keyring` 3 wrote, so nobody is signed out by the move.
proton-auth-rs = { workspace = true, features = ["keyring"] }
proton-media-rs.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
zeroize.workspace = true
directories.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "tiff", "bmp"] }

[dev-dependencies]
async-trait.workspace = true

[lints.rust]
unsafe_code = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"
