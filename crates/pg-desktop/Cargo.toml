[package]
name = "pg-desktop"
description = "Proton Gallery for Linux and Windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "proton-gallery"
path = "src/main.rs"

[dependencies]
pg-app.workspace = true
pg-core.workspace = true
pg-drive.workspace = true
proton-sdk.workspace = true
tempfile.workspace = true
serde_json.workspace = true
iced = { version = "=0.14.0", features = ["image", "svg", "tokio", "advanced"] }
keyring = { version = "=3.6.3", features = ["sync-secret-service", "crypto-rust", "windows-native"] }
tokio.workspace = true
tracing.workspace = true
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "env-filter", "std"] }
zeroize.workspace = true
directories.workspace = true
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }

[lints.rust]
unsafe_code = "deny"

[target.'cfg(target_os = "linux")'.dependencies]
gstreamer = "0.25"
gstreamer-app = "0.25"
gstreamer-video = "0.25"
rustix = { version = "1", features = ["process"] }

[target.'cfg(target_os = "windows")'.dependencies]
raw-window-handle = "0.6"
windows = { version = "0.62", features = ["Security_Credentials_UI", "Win32_Foundation", "Win32_System_WinRT"] }
windows-future = "0.3"
