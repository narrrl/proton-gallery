[workspace]
resolver = "2"
members = ["crates/pg-cli", "crates/pg-mobile", "crates/pg-desktop"]

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
# Gallery core, Drive adapter and app services, shared with proton-drive-linux
# through crates.io (https://github.com/narrrl/proton-rs).
proton-gallery-rs = "0.1.0"
proton-gallery-drive-rs = "0.1.2"
proton-gallery-app-rs = "0.1.0"
proton-auth-rs = "0.1"
proton-media-rs = { version = "0.1.1", features = ["image"] }
proton-sdk = "=0.12.2"
proton-drive-rs = "=0.12.2"
aes-gcm = { version = "0.11", features = ["zeroize"] }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
directories = "6"
getrandom = "0.4"
hex = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"
uniffi = "=0.32.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package."*"]
# Proton's crypto must be usable in development builds as well as releases.
opt-level = 2

[profile.release]
strip = "symbols"
