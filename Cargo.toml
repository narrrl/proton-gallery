[workspace]
resolver = "2"
members = ["crates/pg-core", "crates/pg-drive", "crates/pg-app", "crates/pg-cli", "crates/pg-mobile", "crates/pg-desktop"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.96"
license = "MIT"

[workspace.dependencies]
pg-core = { path = "crates/pg-core" }
pg-drive = { path = "crates/pg-drive" }
pg-app = { path = "crates/pg-app" }
proton-sdk = "=0.12.1"
proton-drive-rs = "=0.12.1"
aes-gcm = { version = "0.11", features = ["zeroize"] }
anyhow = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
directories = "6"
getrandom = "0.4"
hex = "0.4"
rusqlite = { version = "0.41", features = ["bundled"] }
rpassword = "7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tempfile = "3"
thiserror = "2"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
zeroize = "1"
uniffi = "=0.32.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev.package."*"]
# Proton's crypto must be usable in development builds as well as releases.
opt-level = 2

[profile.release]
strip = "symbols"
