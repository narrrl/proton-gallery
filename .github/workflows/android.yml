# Checks every push and pull request. A version tag (v1.2.3) also builds the
# release APK, signed with the release key from repository secrets, and
# publishes it alongside the Linux desktop packages.
#
# Secrets for releases (Settings > Secrets and variables > Actions):
#   RELEASE_KEYSTORE_BASE64  base64 of release.p12 (base64 -w0 release.p12)
#   RELEASE_STORE_PASSWORD   store_password from release.json
#   RELEASE_KEY_PASSWORD     key_password from release.json
#   RELEASE_KEY_ALIAS        alias from release.json
name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  NDK_VERSION: 30.0.16248370
  BUILD_TOOLS: 37.0.0
  CARGO_NDK_VERSION: 4.1.2

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: The tag, Cargo.toml and the app agree
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          app="$(sed -n 's/^ *versionName = "\([^"]*\)"/\1/p' android/app/build.gradle.kts | head -n1)"
          echo "tag=$tag cargo=$cargo app=$app"
          [ "$tag" = "$cargo" ] || { echo "::error::tag $tag != Cargo.toml $cargo"; exit 1; }
          [ "$tag" = "$app" ] || { echo "::error::tag $tag != versionName $app"; exit 1; }
          ! grep -q '^\[patch\.crates-io\]' Cargo.toml || { echo "::error::releases build against the registry SDK"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux desktop build dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxkbcommon-dev libwayland-dev libudev-dev libegl1-mesa-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-plugins-base gstreamer1.0-plugins-good gstreamer1.0-plugins-bad
      - name: Rust checks
        run: bash scripts/check.sh

  android:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, x86_64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-ndk-${{ env.NDK_VERSION }}-cargo-ndk-${{ env.CARGO_NDK_VERSION }}
          cache-on-failure: true
      # The action's default package list includes "tools", which the SDK
      # repository no longer offers, so name the packages explicitly.
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools ndk;${{ env.NDK_VERSION }} build-tools;${{ env.BUILD_TOOLS }} platforms;android-36
      - name: cargo-ndk
        run: |
          if ! cargo ndk --version 2>/dev/null | grep -Fxq "cargo-ndk ${CARGO_NDK_VERSION}"; then
            cargo install cargo-ndk --version "${CARGO_NDK_VERSION}" --locked
          fi
      - uses: gradle/actions/setup-gradle@v4
        with:
          # Branch reruns can reuse the resolved SDK jar and Gradle state.
          # Fork pull requests can restore the base cache.
          cache-read-only: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.fork }}
      - name: Unit tests and lint
        run: android/gradlew -p android --no-daemon testDebugUnitTest lintDebug
      - name: Release APK
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          PG_ANDROID_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          PG_ANDROID_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          PG_ANDROID_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          keystore="$RUNNER_TEMP/release.p12"
          (umask 077 && printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$keystore")
          unset RELEASE_KEYSTORE_BASE64
          PG_ANDROID_KEYSTORE="$keystore" android/gradlew -p android --no-daemon --no-configuration-cache \
            assembleRelease lintRelease
          rm -f "$keystore"
          apk=android/app/build/outputs/apk/release/app-release.apk
          "$ANDROID_HOME/build-tools/${BUILD_TOOLS}/apksigner" verify --print-certs "$apk" | grep -v -i "password"
          cp "$apk" "proton-gallery-${GITHUB_REF_NAME}.apk"
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: proton-gallery-apk
          path: proton-gallery-*.apk
          if-no-files-found: error

  linux-packages:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/linux-packages.yml

  windows-package:
    if: startsWith(github.ref, 'refs/tags/v')
    uses: ./.github/workflows/windows-package.yml

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, linux-packages, windows-package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: proton-gallery-apk
      - uses: actions/download-artifact@v4
        with:
          name: proton-gallery-linux-packages
      - uses: actions/download-artifact@v4
        with:
          name: proton-gallery-windows
      - name: Install RPM signing tools
        run: sudo apt-get update && sudo apt-get install -y rpm gnupg
      - name: Sign and verify RPMs
        env:
          RPM_SIGNING_SUBKEY: ${{ secrets.RPM_SIGNING_SUBKEY }}
          RPM_SIGNING_PASSPHRASE: ${{ secrets.RPM_SIGNING_PASSPHRASE }}
        run: bash scripts/sign-rpm.sh proton-gallery-*.rpm
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          notes="$RUNNER_TEMP/release-notes.md"
          awk -v heading="## $version" '
            /^## / { if (printing) exit; printing = ($0 == heading); next }
            printing { print }
          ' CHANGELOG.md > "$notes"
          if ! grep -q '[^[:space:]]' "$notes"; then
            echo "::error::Missing changelog entry for $version"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" proton-gallery-*.apk proton-gallery_*.deb proton-gallery-*.rpm proton-gallery-*-x86_64-windows.zip proton-gallery-*-x64.msi packaging/RPM-GPG-KEY-proton-gallery \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag --title "Proton Gallery $version" --generate-notes --notes-file "$notes"
