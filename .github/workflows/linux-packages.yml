name: Linux packages

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - crates/**
      - images/**
      - packaging/**
      - scripts/package-linux.sh
      - .github/workflows/linux-packages.yml
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-packages
      - name: Install platform and packaging dependencies
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxkbcommon-dev libwayland-dev libudev-dev libegl1-mesa-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev rpm cpio file desktop-file-utils
      - name: Build packages
        run: scripts/package-linux.sh
      - name: Check the packaged launcher and icon
        run: |
          for format in deb rpm; do
            stage="$RUNNER_TEMP/package-$format"
            mkdir -p "$stage"
            if [[ $format == deb ]]; then
              dpkg-deb --info dist/*.deb
              dpkg-deb --extract dist/*.deb "$stage"
            else
              rpm -qp --requires dist/*.rpm
              rpm2cpio dist/*.rpm | (cd "$stage" && cpio -id --quiet)
            fi
            launcher="$stage/usr/share/applications/io.narl.proton-gallery.desktop"
            desktop-file-validate "$launcher"
            icon="$(sed -n 's/^Icon=//p' "$launcher")"
            test -s "$stage$icon"
            test -x "$stage/usr/bin/proton-gallery"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: proton-gallery-linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
