name: Windows package

on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    paths:
      - crates/pg-desktop/**
      - packaging/windows/**
      - scripts/build-windows.sh
      - .github/workflows/windows-package.yml

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-package
      - name: Install cross-compiler and packaging tools
        run: sudo apt-get update && sudo apt-get install -y mingw-w64 msitools wixl zip
      - name: Cache GStreamer for Windows
        uses: actions/cache@v4
        with:
          path: target/windows-deps/*.msi
          key: gstreamer-windows-${{ hashFiles('scripts/build-windows.sh') }}
      - name: Build the zip and the installer
        run: scripts/build-windows.sh
      - name: Check the payload
        run: |
          test -f dist/windows/bin/proton-gallery.exe
          test -f dist/windows/lib/gstreamer-1.0/libgstplayback.dll
          test -f dist/windows/share/proton-gallery/basemap-v1.pmtiles
          msiinfo export dist/proton-gallery-*.msi File | grep -q proton-gallery.exe
      - uses: actions/upload-artifact@v4
        with:
          name: proton-gallery-windows
          path: |
            dist/proton-gallery-*-x86_64-windows.zip
            dist/proton-gallery-*-x64.msi
          if-no-files-found: error
