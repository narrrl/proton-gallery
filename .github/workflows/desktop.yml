name: Desktop

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux platform dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev libxkbcommon-dev libwayland-dev libudev-dev libegl1-mesa-dev
      - uses: Swatinem/rust-cache@v2
      - name: Shared services and desktop tests
        run: cargo test -p pg-core -p pg-drive -p pg-app -p pg-desktop --all-targets --locked
      - name: Compile the Iced executable
        run: cargo build -p pg-desktop --locked
